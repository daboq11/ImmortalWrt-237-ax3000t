name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004) openssl jq
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        set +e
        if make -j$(nproc); then
          COMPILE_RESULT="success"
        elif make -j1; then
          COMPILE_RESULT="success"
        elif make -j1 V=s; then
          COMPILE_RESULT="success"
        else
          COMPILE_RESULT="fail"
        fi
        set -e
        echo "COMPILE_RESULT=${COMPILE_RESULT}" >> $GITHUB_ENV
        if [ "${COMPILE_RESULT}" = "success" ];then
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        fi

    - name: 推送
      id: bark_func
      run: |
        cat > bark_send.sh <<'EOF'
        #!/bin/bash
        # 参
        DEVICE_KEY="$1"
        AES_RAW_KEY="$2"
        AES_RAW_IV="$3"
        TITLE="$4"
        BODY="$5"
        GROUP="$6"

        # 校验
        if [[ ${#AES_RAW_KEY} -ne 16 || ${#AES_RAW_IV} -ne 16 ]];then
          echo "错误：AES加密密钥与IV必须是16位字符串"
          exit 1
        fi
        if [[ -z "${DEVICE_KEY}" ]];then
          echo "未配置BARK设备密钥，跳过推送"
          exit 0
        fi

        # 组
        JSON_CONTENT=$(jq -n \
          --arg dk "$DEVICE_KEY" \
          --arg t "$TITLE" \
          --arg b "$BODY" \
          --arg g "$GROUP" \
          '{
            device_key: $dk,
            title: $t,
            body: $b,
            group: $g,
            isArchive: 1
          }')

        # 原始
        HEX_KEY=$(printf "%s" "$AES_RAW_KEY" | xxd -ps -c 200)
        HEX_IV=$(printf "%s" "$AES_RAW_IV" | xxd -ps -c 200)

        # 
        CIPHERTEXT=$(echo -n "$JSON_CONTENT" | openssl enc -aes-128-cbc -K "${HEX_KEY}" -iv "${HEX_IV}" | base64 -w 0)

        # 
        curl -s -X POST "https://api.day.app/push" \
          --data-urlencode "ciphertext=${CIPHERTEXT}" \
          --data-urlencode "iv=${AES_RAW_IV}"

        echo -e "\nBark加密推送执行完成"
        EOF
        chmod +x bark_send.sh

    - name: 失败通知
      if: ${{ env.COMPILE_RESULT == 'fail' && !cancelled() }}
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_ENCRYPT_KEY: ${{ secrets.BARK_ENCRYPT_KEY }}
        BARK_ENCRYPT_IV: ${{ secrets.BARK_ENCRYPT_IV }}
      run: |
        ./bark_send.sh \
          "${BARK_KEY}" \
          "${BARK_ENCRYPT_KEY}" \
          "${BARK_ENCRYPT_IV}" \
          "ImmortalWrt AX3000T 编译失败" \
          "❌ 固件编译失败，流水线终止\n设备型号：AX3000T-237\n源码分支：${REPO_BRANCH}\n请前往 Actions 日志排查错误" \
          "OpenWrt编译通知"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        rm -rf *.buildinfo
        rm -rf *.manifest
        rm -rf *.json
        rm -rf *bl2.bin
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to cowtransfer
      id: cowtransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_COWTRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer cow --block 2621440 -s -p 64 --no-progress ${FIRMWARE} 2>&1 | tee cowtransfer.log
        echo "::warning file=cowtransfer.com::$(cat cowtransfer.log | grep https)"
        echo "url=$(cat cowtransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Upload firmware to WeTransfer
      id: wetransfer
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WETRANSFER == 'true' && !cancelled()
      run: |
        curl -fsSL git.io/file-transfer | sh
        ./transfer wet -s -p 16 --no-progress ${FIRMWARE} 2>&1 | tee wetransfer.log
        echo "::warning file=wetransfer.com::$(cat wetransfer.log | grep https)"
        echo "url=$(cat wetransfer.log | grep https | cut -f3 -d" ")" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M-immortalwrt24.10-6.6-xiaomi_mi-router-ax3000t-237")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "ax3000t-237固件" >> release.txt
        echo "后台地址：192.168.1.1" >> release.txt
        echo "登录账号：root" >> release.txt
        echo "登录密码：无" >> release.txt
        echo "默认主题：Bootstrap" >> release.txt
        echo "集成插件：argon、luci-app-adguardhome、mtwifi-cfg，其余插件可在软件包自行安装" >> release.txt
        echo "编译源码：https://github.com/padavanonly/immortalwrt-mt798x-6.6" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: 完成通知
      if: ${{ !cancelled() && env.COMPILE_RESULT == 'success' }}
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
        BARK_ENCRYPT_KEY: ${{ secrets.BARK_ENCRYPT_KEY }}
        BARK_ENCRYPT_IV: ${{ secrets.BARK_ENCRYPT_IV }}
      run: |
        ./bark_send.sh \
          "${BARK_KEY}" \
          "${BARK_ENCRYPT_KEY}" \
          "${BARK_ENCRYPT_IV}" \
          "ImmortalWrt AX3000T 编译完成" \
          "✅ 固件编译 + Release上传全部完成\n设备型号：AX3000T-237\n源码分支：${REPO_BRANCH}\n发布标签：${{ steps.tag.outputs.release_tag }}" \
          "OpenWrt编译通知"
