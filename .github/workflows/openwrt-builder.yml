name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo config
        uses: actions/checkout@v4

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/docker
          sudo apt-get -qq update
          sudo apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004) openssl jq
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean
          sudo timedatectl set-timezone "${TZ}"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone ImmortalWrt source code
        working-directory: /workdir
        run: |
          git clone "${REPO_URL}" -b "${REPO_BRANCH}" openwrt
          ln -sf /workdir/openwrt "${GITHUB_WORKSPACE}/openwrt"

      - name: Apply diy-part1 & custom feeds
        run: |
          [ -e "${FEEDS_CONF}" ] && mv "${FEEDS_CONF}" openwrt/feeds.conf.default
          chmod +x "${DIY_P1_SH}"
          cd openwrt
          "${GITHUB_WORKSPACE}/${DIY_P1_SH}"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply config & diy-part2
        run: |
          [ -e files ] && mv files openwrt/files
          [ -e "${CONFIG_FILE}" ] && mv "${CONFIG_FILE}" openwrt/.config
          chmod +x "${DIY_P2_SH}"
          cd openwrt
          "${GITHUB_WORKSPACE}/${DIY_P2_SH}"

      - name: SSH remote connect
        uses: P3TERX/ssh2actions@v1.0.0
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')

      - name: Download all source packages
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        id: compile_build
        run: |
          cd openwrt
          echo "Compile threads: $(nproc)"
          set +e
          COMPILE_RESULT="fail"
          if make -j$(nproc); then
            COMPILE_RESULT="success"
          elif make -j1; then
            COMPILE_RESULT="success"
          elif make -j1 V=s; then
            COMPILE_RESULT="success"
          fi
          set -e
          echo "COMPILE_RESULT=${COMPILE_RESULT}" >> $GITHUB_ENV

          if [[ "${COMPILE_RESULT}" == "success" ]];then
            DEV_NAME=$(grep '^Target-Profile:' .targetinfo | head -n1 | awk '{print $2}')
            [ -z "${DEV_NAME}" ] && DEV_NAME="xiaomi_mi-router-ax3000t-237"
            echo "DEVICE_NAME=_${DEV_NAME}" >> $GITHUB_ENV
            echo "REAL_DEV_NAME=${DEV_NAME}" >> $GITHUB_ENV
            echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
            echo "RELEASE_TAG=$(date +"%Y.%m.%d-%H%M-immortalwrt24.10-6.6-${DEV_NAME}")" >> $GITHUB_ENV
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "build_status=fail" >> $GITHUB_OUTPUT
          fi

      - name: Terminate workflow when compile failed
        if: env.COMPILE_RESULT != 'success' && !cancelled()
        run: exit 1

      - name: Check disk usage
        run: df -hT

      - name: Organize firmware files
        id: organize_firm
        if: env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages *.buildinfo *.manifest *.json *bl2.bin
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "organize_ok=true" >> $GITHUB_OUTPUT

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        if: steps.organize_firm.outputs.organize_ok == 'true'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_PATH }}

      - name: Prepare release notes
        id: make_release_note
        if: env.UPLOAD_RELEASE == 'true'
        run: |
          echo "release_tag=${{ env.RELEASE_TAG }}" >> $GITHUB_OUTPUT
          echo "小米AX3000T-237 ImmortalWrt固件" > release_info.txt
          echo "后台地址：192.168.1.1" >> release_info.txt
          echo "账号：root" >> release_info.txt
          echo "密码：无" >> release_info.txt
          echo "默认主题：Bootstrap" >> release_info.txt
          echo "预装插件：argon、adguardhome、mtwifi-cfg" >> release_info.txt
          echo "其余插件可软件包手动安装" >> release_info.txt
          echo "编译源码：https://github.com/padavanonly/immortalwrt-mt798x-6.6" >> release_info.txt
          echo "编译分支：${REPO_BRANCH}" >> release_info.txt
          echo "编译设备：${REAL_DEV_NAME}" >> release_info.txt
          echo "编译时间：$(date +"%Y-%m-%d %H:%M:%S")" >> release_info.txt
          echo "release_ok=true" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v1
        if: steps.make_release_note.outputs.release_ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.make_release_note.outputs.release_tag }}
          body_path: release_info.txt
          files:
            - ${{ env.FIRMWARE_PATH }}/*
